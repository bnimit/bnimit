<svg width="1200" height="100" viewBox="0 0 1200 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="aurora-blur-f" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <linearGradient id="top-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1" />
      <stop offset="60%" stop-color="#0d1117" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0d1117" />

  <ellipse cx="300" cy="50" rx="400" ry="120" fill="#8b5cf6" opacity="0.22" filter="url(#aurora-blur-f)">
    <animate attributeName="cx" values="300;700;900;300" dur="20s" repeatCount="indefinite" />
  </ellipse>
  <ellipse cx="800" cy="60" rx="350" ry="100" fill="#3b82f6" opacity="0.20" filter="url(#aurora-blur-f)">
    <animate attributeName="cx" values="800;400;200;800" dur="24s" repeatCount="indefinite" />
  </ellipse>
  <ellipse cx="550" cy="40" rx="300" ry="90" fill="#ec4899" opacity="0.16" filter="url(#aurora-blur-f)">
    <animate attributeName="cx" values="550;900;300;550" dur="22s" repeatCount="indefinite" />
  </ellipse>

  <rect width="100%" height="100%" fill="url(#top-fade)" />
</svg>
